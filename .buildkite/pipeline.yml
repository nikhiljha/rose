env:
  CARGO_TERM_COLOR: "always"
  RUSTFLAGS: "-Dwarnings"

cache:
  paths:
    - target

steps:
  - label: ":memo: Format"
    command: cargo fmt --all -- --check
    if_changed:
      - "**.rs"
      - Cargo.toml
      - Cargo.lock
    plugins:
      - docker#v5.11.0:
          image: "ghcr.io/nikhiljha/rose-ci:latest"
          mount-checkout: true

  - label: ":lint-roller: Clippy"
    command: cargo clippy --workspace --all-targets
    if_changed:
      - "**.rs"
      - Cargo.toml
      - Cargo.lock
    plugins:
      - docker#v5.11.0:
          image: "ghcr.io/nikhiljha/rose-ci:latest"
          mount-checkout: true

  - label: ":bar_chart: Coverage"
    commands:
      - cargo +nightly llvm-cov-easy nextest --workspace --branch
      - cargo test --workspace --doc
      - cargo +nightly llvm-cov report --codecov --output-path codecov.json
      - codecov upload-process --fail-on-error -f codecov.json
    if_changed:
      - "**.rs"
      - Cargo.toml
      - Cargo.lock
    secrets:
      - CODECOV_TOKEN
    plugins:
      - docker#v5.11.0:
          image: "ghcr.io/nikhiljha/rose-ci:latest"
          mount-checkout: true
          environment:
            - CODECOV_TOKEN
            - BUILDKITE
            - BUILDKITE_BRANCH
            - BUILDKITE_BUILD_NUMBER
            - BUILDKITE_BUILD_URL
            - BUILDKITE_COMMIT
            - BUILDKITE_JOB_ID
            - BUILDKITE_ORGANIZATION_SLUG
            - BUILDKITE_PIPELINE_SLUG
            - BUILDKITE_PULL_REQUEST
            - BUILDKITE_REPO

  - label: ":shield: Security"
    command: cargo deny check
    if_changed:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
    plugins:
      - docker#v5.11.0:
          image: "ghcr.io/nikhiljha/rose-ci:latest"
          mount-checkout: true

  - label: ":linux: Build Linux Releases"
    key: "build-linux"
    if: build.tag != null
    command: bash .buildkite/release-build-linux.sh
    artifact_paths:
      - "dist/*.tar.gz"
    plugins:
      - docker#v5.11.0:
          image: "ghcr.io/nikhiljha/rose-ci:latest"
          mount-checkout: true
          environment:
            - BUILDKITE_TAG

  # To enable macOS builds:
  # 1. Create a "macos" queue in your Buildkite cluster
  # 2. Connect a macOS agent to that queue (only needs Rust installed)
  # 3. Uncomment the step below and add "build-macos" to the publish depends_on
  #
  # - label: ":apple: Build macOS Release"
  #   key: "build-macos"
  #   if: build.tag != null
  #   command: bash .buildkite/release-build-macos.sh
  #   artifact_paths:
  #     - "dist/*.tar.gz"
  #   agents:
  #     queue: "macos"

  - label: ":rocket: Publish GitHub Release"
    if: build.tag != null
    depends_on:
      - "build-linux"
      # - "build-macos"  # uncomment when macOS queue is available
    command: bash .buildkite/release-publish.sh
    secrets:
      - GITHUB_TOKEN
    plugins:
      - docker#v5.11.0:
          image: "ghcr.io/nikhiljha/rose-ci:latest"
          mount-checkout: true
          environment:
            - GITHUB_TOKEN
            - BUILDKITE_TAG

  - label: ":zap: Build & Deploy Site"
    if: build.branch == "main" && build.pull_request.id == null
    if_changed:
      - "**.rs"
      - "doc/**"
      - "site/**"
      - Cargo.toml
      - Cargo.lock
    commands:
      - bash site/build.sh
      - wrangler pages deploy site/public --project-name=rose --branch=main
    secrets:
      - CLOUDFLARE_API_TOKEN
      - CLOUDFLARE_ACCOUNT_ID
    plugins:
      - docker#v5.11.0:
          image: "ghcr.io/nikhiljha/rose-ci:latest"
          mount-checkout: true
          environment:
            - CLOUDFLARE_API_TOKEN
            - CLOUDFLARE_ACCOUNT_ID
